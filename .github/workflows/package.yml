name: Package Asset

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version="\([^"]*\)"/\1/p' addons/simple_gdscript_formatter/plugin.cfg)"
          if [ -z "$version" ]; then
            echo "Unable to read version from plugin.cfg" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package_dir="dist/package"
          archive="dist/simple_gdscript_formatter-${version}.zip"

          mkdir -p "$package_dir/addons"
          cp -R addons/simple_gdscript_formatter "$package_dir/addons/"
          cp LICENSE README.md "$package_dir/"

          (
            cd "$package_dir"
            zip -r "../../$archive" addons LICENSE README.md
          )

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: simple_gdscript_formatter-${{ steps.version.outputs.version }}
          path: dist/simple_gdscript_formatter-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
