name: Release Asset

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version="\([^"]*\)"/\1/p' addons/simple_gdscript_formatter/plugin.cfg)"
          if [ -z "$version" ]; then
            echo "Unable to read version from plugin.cfg" >&2
            exit 1
          fi

          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          package_dir="dist/package"
          archive="dist/simple_gdscript_formatter-${version}.zip"

          mkdir -p "$package_dir/addons"
          cp -R addons/simple_gdscript_formatter "$package_dir/addons/"
          cp LICENSE README.md "$package_dir/"

          (
            cd "$package_dir"
            zip -r "../../$archive" addons LICENSE README.md
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          archive="dist/simple_gdscript_formatter-${{ steps.version.outputs.version }}.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --title "$tag" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
